name: adaptalist
description: "鬼島械鬥 - 一個台灣文化的卡牌遊戲"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true

  assets:
    - assets/items/

  fonts:
    - family: Iansui
      fonts:
        - asset: assets/fonts/Iansui-Regular.ttf
    - family: elffont
      fonts:
        - asset: assets/fonts/elffont-fern.otf
          weight: 400
        - asset: assets/fonts/elffont-rock.otf
          weight: 700